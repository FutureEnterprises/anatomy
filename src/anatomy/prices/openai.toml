# OpenAI API list prices, Standard tier, USD per million tokens.
#
# Snapshot of the official pricing page, re-opened on the snapshot date below.
# Long context means more than 272K input tokens on one request; models with a
# [models.<id>.long_context] table bill the whole request at those rates.
# Models without that table have no long-context row on the page and bill at
# their standard rates at every size.
#
# cache_write is omitted where the page shows no cache-write price; cache-write
# tokens on those models (none are reported in Codex rollouts) bill as uncached
# input.

snapshot_date = "2026-09-30"
source_url = "https://developers.openai.com/api/docs/pricing"
long_context_threshold = 272000

[notes]
reasoning = "Codex reports reasoning_output_tokens as a subset of output_tokens; output_tokens are billed at the output rate. The pricing page itself was not confirmed to state this today."
not_confirmed = "codex-auto-review and other internal model ids have no public price and are left unpriced."

[models."gpt-6-astra"]
input = 10.0
cached_input = 1.0
cache_write = 12.5
output = 50.0
long_context = { input = 20.0, cached_input = 2.0, cache_write = 25.0, output = 75.0 }

