# Anthropic Claude API list prices, USD per million tokens (MTok).
#
# Snapshot of the official pricing page, re-opened on the snapshot date below.
# Standard speed, global routing (inference_geo unset), no batch discount.
# Prices change: every report prints this snapshot date next to its dollars.
#
# Model ids: the pricing page lists display names ("Claude Opus 5.5"). The id
# for each row is the display name lowercased with dots as dashes
# ("claude-opus-5-5"). Rows marked id_confirmed = true use an id that was seen
# verbatim in real transcripts; the others are inferred from the display name.
#
# Dated snapshot ids ("claude-haiku-4-5-20251001") match their base row.

snapshot_date = "2026-09-30"
source_url = "https://platform.claude.com/docs/en/about-claude/pricing"

[notes]
cache_read_multiplier = "0.1x base input, except 0.025x on Fable 5.1 and Mythos 5.1 and 0.05x on Opus 5.5 (pricing page footnotes 1 and 2)"
cache_write_multipliers = "5m write 1.25x base input, 1h write 2x base input"
long_context = "Claude 4.6 and later: full 1M context at standard pricing"
data_residency = "inference_geo us: 1.1x on every token category for Claude 4.6 and later"
fast_mode = "Opus 5.5 $8 in / $40 out; Opus 5 and Opus 4.8 $10 in / $50 out; cache multipliers apply on top"
sonnet_5 = "The $2/$10 launch price is now the standard price (footnote 3)"
not_confirmed = "Model ids without id_confirmed are inferred from display names. Refusal and fallback billing of declined attempts is not stated on this page."

[fast_mode]
"claude-opus-5-5" = { input = 8.0, output = 40.0 }
"claude-opus-5" = { input = 10.0, output = 50.0 }
"claude-opus-4-8" = { input = 10.0, output = 50.0 }

[data_residency]
us_multiplier = 1.1

